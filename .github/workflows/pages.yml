name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Halloween idea browser
        run: |
          node --check halloween/app.js
          node --check halloween/ideas.js
          node --check halloween/products.js
          node --check halloween/products-data.js
          node --check halloween/product-images.js

      - name: Build bookshelf lighting guide
        run: |
          python3 bookshelf-lighting/build-page.py
          node --check bookshelf-lighting/app.js

      - name: Build and validate garage planner
        run: |
          python3 garage/build-viewer.py
          node --check garage/viewer.js
          python3 -m json.tool garage/design-data.json > /dev/null
          python3 garage/validate-design.py
          python3 garage/validate-images.py
          python3 garage/test-image-freshness.py
          npm install --prefix "$RUNNER_TEMP/garage-check" --ignore-scripts --no-audit --no-fund three@0.158.0
          node garage/check-storage.mjs "$RUNNER_TEMP/garage-check/node_modules/three"
          node garage/check-camera.mjs "$RUNNER_TEMP/garage-check/node_modules/three"

      - name: Validate print history
        run: |
          python3 printing/build.py
          node --check printing/printing.js
          git diff --exit-code -- printing/records.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
