name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Halloween idea browser
        run: |
          node --check halloween/app.js
          node --check halloween/ideas.js
          node --check halloween/products.js
          node --check halloween/products-data.js
          node --check halloween/product-images.js

      - name: Build bookshelf lighting guide
        run: |
          python3 bookshelf-lighting/build-page.py
          node --check bookshelf-lighting/app.js

      - name: Build and validate garage planner
        run: |
          python3 garage/build-viewer.py
          node --check garage/viewer.js
          python3 -m json.tool garage/design-data.json > /dev/null
          python3 garage/validate-design.py
          python3 garage/validate-images.py
          python3 garage/test-image-freshness.py
          npm install --prefix "$RUNNER_TEMP/garage-check" --ignore-scripts --no-audit --no-fund three@0.158.0
          node garage/check-storage.mjs "$RUNNER_TEMP/garage-check/node_modules/three"
          node garage/check-camera.mjs "$RUNNER_TEMP/garage-check/node_modules/three"

      - name: Validate print history
        run: |
          python3 printing/build.py
          node --check printing/printing.js
          git diff --exit-code -- printing/records.json

      - name: Prepare no-index personal pages
        run: python3 scripts/prepare-pages.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage public site files
        run: |
          mkdir -p "$RUNNER_TEMP/personal-site"
          rsync -a --exclude=.git --exclude=.github --exclude=.impeccable --exclude=analytics-service --exclude=PRODUCT.md --exclude=DESIGN.md --exclude=node_modules ./ "$RUNNER_TEMP/personal-site/"

      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/personal-site

      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          for attempt in {1..12}; do
            if listed=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name=github-pages --jq '.artifacts[] | select(.expired == false) | .id') &&
              printf '%s\n' "$listed" | grep -Fxq "$ARTIFACT_ID"; then
              echo "Pages artifact $ARTIFACT_ID is visible to the deploy action."
              exit 0
            fi
            echo "Waiting for artifact $ARTIFACT_ID to be listed ($attempt/12)."
            sleep 5
          done
          echo "::error::The upload succeeded, but the Pages artifact is still missing from the workflow run."
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
