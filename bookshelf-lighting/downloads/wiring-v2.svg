<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">Bokhyllelys – kontroller v2</title><desc id="desc">Beskyttet batteri via F1 og Lade Av Lys-bryter til lader eller boost. Én felles negativ retur. Boost til fem parallelle motstandsbegrensede lampegrener.</desc>
<defs><style>text{font-family:system-ui,sans-serif;fill:#183b36;font-size:18px}.small{font-size:15px}.title{font-size:25px;font-weight:700}.box{fill:#fff;stroke:#68867b;stroke-width:2}.pos{fill:none;stroke:#b55d36;stroke-width:4;stroke-linejoin:round}.neg{fill:none;stroke:#243839;stroke-width:4}.dash{fill:none;stroke:#b55d36;stroke-width:3;stroke-dasharray:7 5}.dot{fill:#b55d36}</style></defs>
<rect width="1200" height="670" rx="12" fill="#f5f4f0"/>
<text x="35" y="45" class="title">Kontroller v2 · batteri, lading og fem parallelle lykter</text>
<rect x="35" y="100" width="225" height="120" rx="12" class="box"/><text x="55" y="135">Akyga AKY0627</text><text x="55" y="165">1S · 3 500 mAh</text><text x="55" y="195" class="small">PCM inne i pakken · 3,7 V</text>
<path d="M260 135H295" class="pos"/><rect x="295" y="120" width="90" height="30" rx="4" class="box"/><text x="300" y="105" class="small">F1 · 1,6 A</text><path d="M385 135H450V255H510" class="pos"/>
<circle cx="510" cy="255" r="6" class="dot"/><circle cx="555" cy="210" r="5" class="dot"/><circle cx="555" cy="300" r="5" class="dot"/>
<path d="M510 255L550 215 M510 255L550 295" class="dash"/>
<text x="410" y="357">S1 · LADE / AV / LYS</text><text x="410" y="382" class="small">Én forbindelse om gangen; AV bryter begge.</text>
<path d="M555 210H600V145H640" class="pos"/><text x="570" y="195" class="small">LADE</text>
<rect x="640" y="95" width="235" height="120" rx="12" class="box"/><text x="660" y="125">TP4056 · USB-lader</text><text x="660" y="155" class="small">B+ / B− · 4,2 V · opptil 1 A</text><text x="660" y="185" class="small">OUT+ / OUT− brukes ikke.</text>
<path d="M1020 115H875" class="neg"/><text x="905" y="90" class="small">USB-A → USB-C</text><text x="905" y="145" class="small">5 V / minst 1 A</text>
<path d="M555 300H640" class="pos"/><text x="570" y="285" class="small">LYS</text>
<rect x="640" y="260" width="235" height="120" rx="12" class="box"/><text x="660" y="291">Elkim boost</text><text x="660" y="322" class="small">BAT+/BAT− → VOUT+/VOUT−</text><text x="660" y="350" class="small">Juster til 4,5 V. USB/IN ubrukt.</text>
<path d="M260 200H300V425H780V380 M740 425V215" class="neg"/><text x="38" y="415" class="small">Batteri − til begge kortenes batteri −</text>
<path d="M875 300H915" class="pos"/><rect x="915" y="285" width="95" height="30" rx="4" class="box"/><text x="900" y="265" class="small">F2 · 250 mA</text><path d="M1010 300H1140V470H170" class="pos"/>
<path d="M850 380V610H1140H170" class="neg"/>
<text x="35" y="475" class="small">+ 4,5 V</text><text x="35" y="615" class="small">VOUT−</text>
<g class="small"><path d="M230 470V488 M430 470V488 M630 470V488 M830 470V488 M1030 470V488" class="pos"/>
<rect x="215" y="488" width="30" height="37" class="box"/><rect x="415" y="488" width="30" height="37" class="box"/><rect x="615" y="488" width="30" height="37" class="box"/><rect x="815" y="488" width="30" height="37" class="box"/><rect x="1015" y="488" width="30" height="37" class="box"/>
<text x="254" y="514">1 kΩ</text><text x="454" y="514">1 kΩ</text><text x="654" y="514">1 kΩ</text><text x="854" y="514">1 kΩ</text><text x="1054" y="514">1 kΩ</text>
<path d="M230 525V540 M430 525V540 M630 525V540 M830 525V540 M1030 525V540" class="pos"/>
<rect x="175" y="540" width="110" height="42" rx="6" class="box"/><text x="187" y="568">Lykt 1</text><rect x="375" y="540" width="110" height="42" rx="6" class="box"/><text x="387" y="568">Lykt 2</text><rect x="575" y="540" width="110" height="42" rx="6" class="box"/><text x="587" y="568">Lykt 3</text><rect x="775" y="540" width="110" height="42" rx="6" class="box"/><text x="787" y="568">Lykt 4</text><rect x="975" y="540" width="110" height="42" rx="6" class="box"/><text x="987" y="568">Lykt 5</text>
<path d="M230 582V610 M430 582V610 M630 582V610 M830 582V610 M1030 582V610" class="neg"/>
</g><text x="35" y="651" class="small">Alle AG3/LR41-celler fjernes. Behold lampens originale elektronikk og kontroller original strøm før ombygging.</text></svg>
